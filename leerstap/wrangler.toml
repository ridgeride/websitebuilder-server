# Cloudflare-configuratie voor Leerstap. Stappen staan in UITROL.md.
name = "leerstap"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Eigen domein; Cloudflare maakt DNS en HTTPS-certificaat zelf aan.
routes = [
  { pattern = "leerstap.nl", custom_domain = true },
  { pattern = "www.leerstap.nl", custom_domain = true },
]

[assets]
directory = "dist/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Database met accounts, leerstof en resultaten. Vul database_id in na `npx wrangler d1 create`.
[[d1_databases]]
binding = "DB"
database_name = "leerstap"
database_id = "5ab2ad76-ba93-4432-9b18-5853d7d127ad"
migrations_dir = "migrations"

# Bestandsopslag voor geüploade bronnen, binnen de EU.
[[r2_buckets]]
binding = "FILES"
bucket_name = "leerstap-bestanden"
jurisdiction = "eu"

[vars]
OPENAI_MODEL = "gpt-4.1-mini"
AI_MONTHLY_LIMIT = "30"
# Alleen met een uitnodiging een account maken (persoonlijke uitnodigingen via Beheer).
INVITE_ONLY = "true"
# Wie de pagina Beheer ziet: e-mailadressen van ouderaccounts, gescheiden door komma's.
ADMIN_EMAILS = "jmvdneut88@gmail.com"
# Geheimen (niet hier invullen): `npx wrangler secret put OPENAI_API_KEY` en eventueel INVITE_CODE.

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
